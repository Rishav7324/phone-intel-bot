name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release archive
        run: |
          zip -r phone-intel-bot-${GITHUB_REF_NAME}.zip . \
            -x '.git/*' '.github/*' '.venv/*' '__pycache__/*' '*.pyc' '.env'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: phone-intel-bot-${{ github.ref_name }}.zip
